  <radialGradient id="glow0" cx="0.82" cy="0.62" r="0.6"><stop offset="0" stop-color="#2f6fed" stop-opacity="0.12"/><stop offset="1" stop-color="#2f6fed" stop-opacity="0"/></radialGradient><radialGradient id="glow1" cx="0.05" cy="-0.15" r="0.6"><stop offset="0" stop-color="#6d5cf0" stop-opacity="0.12"/><stop offset="1" stop-color="#6d5cf0" stop-opacity="0"/></radialGradient>
  
