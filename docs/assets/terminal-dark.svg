<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Command line and panels</title>
<desc id="desc">Terminal showing ipadmode remote, status and doctor, next to the confirmation panel and a notice.</desc>
<style>
  .sans{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
  .mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
  .t1{fill:#e8edf4} .t2{fill:#a6b2c3} .tm{fill:#6f7d91} .ta{fill:#5b8cff} .tg{fill:#3ccf8e}
  .flow{stroke-dasharray:6 9;animation:dash 1.1s linear infinite}
  .pulse{animation:pulse 3.2s ease-in-out infinite}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes dash{to{stroke-dashoffset:-30}}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){.flow,.pulse,.blink{animation:none}}
  
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e15"/><stop offset="1" stop-color="#0f1520"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#8b7bff"/></linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6fed"/><stop offset=".55" stop-color="#6d5cf0"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.045"/></pattern>
  <clipPath id="clip"><rect width="1200" height="620" rx="20"/></clipPath>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#6f7d91" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#5b8cff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#3ccf8e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <radialGradient id="glow0" cx="0.85" cy="0.3" r="0.6"><stop offset="0" stop-color="#5b8cff" stop-opacity="0.22"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient><radialGradient id="glow1" cx="0.0" cy="1.0" r="0.6"><stop offset="0" stop-color="#8b7bff" stop-opacity="0.22"/><stop offset="1" stop-color="#8b7bff" stop-opacity="0"/></radialGradient>
  
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="620" fill="url(#bg)"/>
  <rect width="1200" height="620" fill="url(#dots)"/>
  <rect width="1200" height="620" fill="url(#glow0)"/><rect width="1200" height="620" fill="url(#glow1)"/>
</g>
<rect x=".5" y=".5" width="1199" height="619" rx="19.5" fill="none" stroke="#1d2633"/>
<text x="40" y="56" class="mono ta" font-size="13" font-weight="600" text-anchor="start" letter-spacing="2.2">COMMAND LINE</text><text x="40" y="96" class="sans t1" font-size="32" font-weight="700" text-anchor="start" letter-spacing="-0.6">Scriptable, and safe over SSH</text><g filter="url(#shadow)"><rect x="32" y="120" width="780" height="470" rx="12" fill="#0b0f17"/></g><rect x="32" y="120" width="780" height="470" rx="12" fill="none" stroke="#243246"/><path d="M32 132 a12 12 0 0 1 12 -12 h756 a12 12 0 0 1 12 12 v24 h-780 z" fill="#151c28"/><circle cx="54" cy="138" r="6" fill="#ff5f57"/><circle cx="74" cy="138" r="6" fill="#febc2e"/><circle cx="94" cy="138" r="6" fill="#28c840"/><text x="422.0" y="143" class="sans tm" font-size="13" font-weight="500" text-anchor="middle">zsh — ipadmode</text><text x="54" y="186" class="mono" font-size="14.5" xml:space="preserve"><tspan fill="#4ade80">$ </tspan><tspan fill="#d7dee8">ipadmode remote</tspan></text><text x="54" y="207.5" class="mono" font-size="14.5" xml:space="preserve"><tspan fill="#d7dee8">Mode Remote iPad aktif — konfirmasi di layar dalam 20 detik.</tspan></text><text x="54" y="250.5" class="mono" font-size="14.5" xml:space="preserve"><tspan fill="#4ade80">$ </tspan><tspan fill="#d7dee8">ipadmode status</tspan></text><text x="54" y="272.0" class="mono" font-size="14.5" xml:space="preserve"><tspan fill="#7d8aa0">Mode: </tspan><tspan fill="#7aa7ff">Remote</tspan></text><text x="54" y="293.5" class="mono" font-size="14.5" xml:space="preserve"><tspan fill="#7d8aa0">Layar:</tspan></text><text x="54" y="315.0" class="mono" font-size="14.5" xml:space="preserve"><tspan fill="#d7dee8">  iPad Remote </tspan><tspan fill="#7d8aa0">[virtual ipadmode, id 70] </tspan><tspan fill="#d7dee8">online, aktif, utama — 1180x820 @60Hz</tspan></text><text x="54" y="336.5" class="mono" font-size="14.5" xml:space="preserve"><tspan fill="#d7dee8">  Display 1 </tspan><tspan fill="#7d8aa0">[monitor, id 1] </tspan><tspan fill="#d7dee8">offline, tidak aktif</tspan></text><text x="54" y="358.0" class="mono" font-size="14.5" xml:space="preserve"><tspan fill="#d7dee8">  Display 3 </tspan><tspan fill="#7d8aa0">[monitor, id 3] </tspan><tspan fill="#d7dee8">offline, tidak aktif</tspan></text><text x="54" y="379.5" class="mono" font-size="14.5" xml:space="preserve"><tspan fill="#7d8aa0">Mac terkunci: </tspan><tspan fill="#d7dee8">tidak</tspan></text><text x="54" y="401.0" class="mono" font-size="14.5" xml:space="preserve"><tspan fill="#7d8aa0">Daemon: </tspan><tspan fill="#d7dee8">PID 65281, detak 0 dtk lalu</tspan></text><text x="54" y="422.5" class="mono" font-size="14.5" xml:space="preserve"><tspan fill="#7d8aa0">Watchdog: </tspan><tspan fill="#d7dee8">PID 65279, detak 0 dtk lalu</tspan></text><text x="54" y="465.5" class="mono" font-size="14.5" xml:space="preserve"><tspan fill="#4ade80">$ </tspan><tspan fill="#d7dee8">ipadmode doctor</tspan></text><text x="54" y="487.0" class="mono" font-size="14.5" xml:space="preserve"><tspan fill="#4ade80">OK </tspan><tspan fill="#d7dee8">API layar virtualDisplay tersedia.</tspan></text><text x="54" y="508.5" class="mono" font-size="14.5" xml:space="preserve"><tspan fill="#4ade80">OK </tspan><tspan fill="#d7dee8">Agen local.ipadmode.watchdog termuat.</tspan></text><text x="54" y="530.0" class="mono" font-size="14.5" xml:space="preserve"><tspan fill="#4ade80">OK </tspan><tspan fill="#d7dee8">Detak daemon segar (PID 65281).</tspan></text><text x="54" y="551.5" class="mono" font-size="14.5" xml:space="preserve"><tspan fill="#fbbf24">PERINGATAN </tspan><tspan fill="#d7dee8">Update macOS otomatis aktif; Mac bisa restart sendiri saat Anda remote.</tspan></text><text x="54" y="573.0" class="mono" font-size="14.5"><tspan fill="#4ade80">$ </tspan><tspan fill="#d7dee8" class="blink">▍</tspan></text><g filter="url(#shadow)"><rect x="852" y="176" width="316" height="172" rx="14" fill="#262a31"/></g><rect x="852" y="176" width="316" height="172" rx="14" fill="none" stroke="#3a404a"/><text x="878" y="226" class="sans" font-size="17" font-weight="700" fill="#f2f4f7">Tampilan iPad aktif.</text><text x="878" y="254" class="sans" font-size="14.5" fill="#b5bcc8">Kembali otomatis dalam 20 detik.</text><rect x="878" y="288" width="120" height="32" rx="8" fill="#3b414b"/><text x="938" y="309" class="sans" font-size="14.5" font-weight="500" text-anchor="middle" fill="#f2f4f7">Kembalikan</text><rect x="1010" y="288" width="132" height="32" rx="8" fill="#2f6fed"/><text x="1076" y="309" class="sans" font-size="14.5" font-weight="600" text-anchor="middle" fill="#ffffff">Pertahankan</text><text x="852" y="378" class="sans tm" font-size="14" font-weight="400" text-anchor="start">Confirm panel. Return keeps,</text><text x="852" y="398" class="sans tm" font-size="14" font-weight="400" text-anchor="start">Escape or no answer reverts.</text><g filter="url(#shadow)"><rect x="852" y="450" width="316" height="48" rx="12" fill="#262a31"/></g><rect x="852" y="450" width="316" height="48" rx="12" fill="none" stroke="#3a404a"/><circle cx="876" cy="474" r="5" fill="#3ccf8e"/><text x="892" y="479.5" class="sans" font-size="15" font-weight="500" fill="#f2f4f7">Kembali ke Normal.</text><text x="852" y="528" class="sans tm" font-size="14" font-weight="400" text-anchor="start">Notices appear at the top of the screen.</text>
</svg>
