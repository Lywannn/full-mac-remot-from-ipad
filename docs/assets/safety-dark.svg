<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">Safety layers</title>
<desc id="desc">Eight layers: confirmation, end on lock, write-ahead state, child restores monitors (0.23 s), watchdog (4.8 s), launchd KeepAlive (0.02 s), safe mode, manual way out.</desc>
<style>
  .sans{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
  .mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
  .t1{fill:#e8edf4} .t2{fill:#a6b2c3} .tm{fill:#6f7d91} .ta{fill:#5b8cff} .tg{fill:#3ccf8e}
  .flow{stroke-dasharray:6 9;animation:dash 1.1s linear infinite}
  .pulse{animation:pulse 3.2s ease-in-out infinite}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes dash{to{stroke-dashoffset:-30}}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){.flow,.pulse,.blink{animation:none}}
  
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e15"/><stop offset="1" stop-color="#0f1520"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#8b7bff"/></linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6fed"/><stop offset=".55" stop-color="#6d5cf0"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.045"/></pattern>
  <clipPath id="clip"><rect width="1200" height="710" rx="20"/></clipPath>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#6f7d91" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#5b8cff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#3ccf8e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <radialGradient id="glow0" cx="1.0" cy="0.0" r="0.6"><stop offset="0" stop-color="#5b8cff" stop-opacity="0.22"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient><radialGradient id="glow1" cx="0.0" cy="1.0" r="0.6"><stop offset="0" stop-color="#8b7bff" stop-opacity="0.22"/><stop offset="1" stop-color="#8b7bff" stop-opacity="0"/></radialGradient>
  
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="710" fill="url(#bg)"/>
  <rect width="1200" height="710" fill="url(#dots)"/>
  <rect width="1200" height="710" fill="url(#glow0)"/><rect width="1200" height="710" fill="url(#glow1)"/>
</g>
<rect x=".5" y=".5" width="1199" height="709" rx="19.5" fill="none" stroke="#1d2633"/>
<text x="40" y="56" class="mono ta" font-size="13" font-weight="600" text-anchor="start" letter-spacing="2.2">SAFETY</text><text x="40" y="96" class="sans t1" font-size="32" font-weight="700" text-anchor="start" letter-spacing="-0.6">Eight layers between you and a dark Mac</text><text x="110" y="138" class="mono tm" font-size="12.5" font-weight="600" text-anchor="start" letter-spacing="1.6">LAYER</text><text x="560" y="138" class="mono tm" font-size="12.5" font-weight="600" text-anchor="start" letter-spacing="1.6">PROTECTS AGAINST</text><text x="1144" y="138" class="mono tm" font-size="12.5" font-weight="600" text-anchor="end" letter-spacing="1.6">MEASURED</text><defs><linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#3ccf8e"/></linearGradient></defs><rect x="32" y="152" width="4" height="518" rx="2" fill="url(#rail)"/><rect x="48" y="152" width="1120" height="56" rx="12" fill="#121a26" stroke="#243246"/><text x="70" y="187" class="mono ta" font-size="14" font-weight="700" text-anchor="start">L1</text><text x="110" y="187" class="sans t1" font-size="17" font-weight="650" text-anchor="start">20-second confirmation</text><text x="560" y="187" class="sans t2" font-size="16" font-weight="400" text-anchor="start">A black screen, or RustDesk didn't follow</text><rect x="48" y="218" width="1120" height="56" rx="12" fill="#121a26" stroke="#243246"/><text x="70" y="253" class="mono ta" font-size="14" font-weight="700" text-anchor="start">L2</text><text x="110" y="253" class="sans t1" font-size="17" font-weight="650" text-anchor="start">Mode ends when the Mac locks</text><text x="560" y="253" class="sans t2" font-size="16" font-weight="400" text-anchor="start">Forgetting to switch back</text><rect x="48" y="284" width="1120" height="56" rx="12" fill="#121a26" stroke="#243246"/><text x="70" y="319" class="mono ta" font-size="14" font-weight="700" text-anchor="start">L3</text><text x="110" y="319" class="sans t1" font-size="17" font-weight="650" text-anchor="start">Write-ahead state, reconciled at start</text><text x="560" y="319" class="sans t2" font-size="16" font-weight="400" text-anchor="start">The daemon dying mid-switch</text><rect x="48" y="350" width="1120" height="56" rx="12" fill="#121a26" stroke="#243246"/><text x="70" y="385" class="mono ta" font-size="14" font-weight="700" text-anchor="start">L4</text><text x="110" y="385" class="sans t1" font-size="17" font-weight="650" text-anchor="start">Child turns monitors on before exiting</text><text x="560" y="385" class="sans t2" font-size="16" font-weight="400" text-anchor="start">A daemon crash while the mode is on</text><rect x="1070" y="364" width="74" height="28" rx="14" fill="#3ccf8e" fill-opacity="0.196"/><text x="1107.0" y="383" class="mono tg" font-size="14" font-weight="700" text-anchor="middle">0.23 s</text><rect x="48" y="416" width="1120" height="56" rx="12" fill="#121a26" stroke="#243246"/><text x="70" y="451" class="mono ta" font-size="14" font-weight="700" text-anchor="start">L5</text><text x="110" y="451" class="sans t1" font-size="17" font-weight="650" text-anchor="start">Independent watchdog, 0.5 s poll</text><text x="560" y="451" class="sans t2" font-size="16" font-weight="400" text-anchor="start">A daemon crash or hang</text><rect x="1070" y="430" width="74" height="28" rx="14" fill="#3ccf8e" fill-opacity="0.196"/><text x="1107.0" y="449" class="mono tg" font-size="14" font-weight="700" text-anchor="middle">4.8 s</text><rect x="48" y="482" width="1120" height="56" rx="12" fill="#121a26" stroke="#243246"/><text x="70" y="517" class="mono ta" font-size="14" font-weight="700" text-anchor="start">L6</text><text x="110" y="517" class="sans t1" font-size="17" font-weight="650" text-anchor="start">launchd KeepAlive</text><text x="560" y="517" class="sans t2" font-size="16" font-weight="400" text-anchor="start">Any of the processes crashing</text><rect x="1070" y="496" width="74" height="28" rx="14" fill="#3ccf8e" fill-opacity="0.196"/><text x="1107.0" y="515" class="mono tg" font-size="14" font-weight="700" text-anchor="middle">0.02 s</text><rect x="48" y="548" width="1120" height="56" rx="12" fill="#121a26" stroke="#243246"/><text x="70" y="583" class="mono ta" font-size="14" font-weight="700" text-anchor="start">L7</text><text x="110" y="583" class="sans t1" font-size="17" font-weight="650" text-anchor="start">Safe mode after 3 crashes in 10 min</text><text x="560" y="583" class="sans t2" font-size="16" font-weight="400" text-anchor="start">Crash loops</text><rect x="48" y="614" width="1120" height="56" rx="12" fill="#121a26" stroke="#243246"/><text x="70" y="649" class="mono ta" font-size="14" font-weight="700" text-anchor="start">L8</text><text x="110" y="649" class="sans t1" font-size="17" font-weight="650" text-anchor="start">Hotkey, SSH CLI and disable</text><text x="560" y="649" class="sans t2" font-size="16" font-weight="400" text-anchor="start">Everything else: a manual way out</text>
</svg>
