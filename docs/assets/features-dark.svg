<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Features</title>
<desc id="desc">Twelve features: one-click switch, HiDPI virtual display, exact layout restore, confirm or revert, ends on lock, crash recovery, emergency hotkey, SSH CLI, doctor, monitor guard, update-safe private APIs, no dependencies.</desc>
<style>
  .sans{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
  .mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
  .t1{fill:#e8edf4} .t2{fill:#a6b2c3} .tm{fill:#6f7d91} .ta{fill:#5b8cff} .tg{fill:#3ccf8e}
  .flow{stroke-dasharray:6 9;animation:dash 1.1s linear infinite}
  .pulse{animation:pulse 3.2s ease-in-out infinite}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes dash{to{stroke-dashoffset:-30}}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){.flow,.pulse,.blink{animation:none}}
  
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e15"/><stop offset="1" stop-color="#0f1520"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#8b7bff"/></linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6fed"/><stop offset=".55" stop-color="#6d5cf0"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.045"/></pattern>
  <clipPath id="clip"><rect width="1200" height="900" rx="20"/></clipPath>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#6f7d91" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#5b8cff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#3ccf8e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <radialGradient id="glow0" cx="0.9" cy="0.0" r="0.6"><stop offset="0" stop-color="#5b8cff" stop-opacity="0.22"/><stop offset="1" stop-color="#5b8cff" stop-opacity="0"/></radialGradient><radialGradient id="glow1" cx="0.0" cy="1.0" r="0.6"><stop offset="0" stop-color="#8b7bff" stop-opacity="0.22"/><stop offset="1" stop-color="#8b7bff" stop-opacity="0"/></radialGradient>
  
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#dots)"/>
  <rect width="1200" height="900" fill="url(#glow0)"/><rect width="1200" height="900" fill="url(#glow1)"/>
</g>
<rect x=".5" y=".5" width="1199" height="899" rx="19.5" fill="none" stroke="#1d2633"/>
<text x="40" y="56" class="mono ta" font-size="13" font-weight="600" text-anchor="start" letter-spacing="2.2">FEATURES</text><text x="40" y="96" class="sans t1" font-size="32" font-weight="700" text-anchor="start" letter-spacing="-0.6">What it does</text><rect x="32.0" y="132" width="368.0" height="172" rx="14" fill="#121a26" stroke="#243246"/><rect x="54.0" y="154" width="44" height="44" rx="12" fill="#5b8cff" fill-opacity="0.196"/><g transform="translate(64.0 164) scale(1.0)" fill="none" stroke="#5b8cff" color="#5b8cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="5"/><circle cx="16" cy="12" r="3" fill="currentColor"/></g><text x="114.0" y="183" class="sans t1" font-size="19" font-weight="650" text-anchor="start" letter-spacing="-0.2">One-click switch</text><text x="56.0" y="230" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">Two Dock buttons, iPad Remote and</text><text x="56.0" y="254" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">Layar Normal. About 3 s to switch;</text><text x="56.0" y="278" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">RustDesk follows, no reconnect.</text><rect x="416.0" y="132" width="368.0" height="172" rx="14" fill="#121a26" stroke="#243246"/><rect x="438.0" y="154" width="44" height="44" rx="12" fill="#5b8cff" fill-opacity="0.196"/><g transform="translate(448.0 164) scale(1.0)" fill="none" stroke="#5b8cff" color="#5b8cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="M8 9h8M8 12.5h5"/></g><text x="498.0" y="183" class="sans t1" font-size="19" font-weight="650" text-anchor="start" letter-spacing="-0.2">Retina-sharp virtual display</text><text x="440.0" y="230" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">A HiDPI display sized like the iPad.</text><text x="440.0" y="254" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">1180×820 at 2x renders 2360×1640 px,</text><text x="440.0" y="278" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">the iPad Air's native panel. 5 sizes.</text><rect x="800.0" y="132" width="368.0" height="172" rx="14" fill="#121a26" stroke="#243246"/><rect x="822.0" y="154" width="44" height="44" rx="12" fill="#5b8cff" fill-opacity="0.196"/><g transform="translate(832.0 164) scale(1.0)" fill="none" stroke="#5b8cff" color="#5b8cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="12" height="8" rx="1.5"/><rect x="16" y="3" width="6" height="11" rx="1.5"/><path d="M8 13v3M5 19h6"/><path d="M19 14v4"/></g><text x="882.0" y="183" class="sans t1" font-size="19" font-weight="650" text-anchor="start" letter-spacing="-0.2">Exact layout restore</text><text x="824.0" y="230" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">Monitors return to the same spots,</text><text x="824.0" y="254" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">rotation and main display. The</text><text x="824.0" y="278" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">virtual display goes last, not first.</text><rect x="32.0" y="320" width="368.0" height="172" rx="14" fill="#121a26" stroke="#243246"/><rect x="54.0" y="342" width="44" height="44" rx="12" fill="#5b8cff" fill-opacity="0.196"/><g transform="translate(64.0 352) scale(1.0)" fill="none" stroke="#5b8cff" color="#5b8cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M10 2.5h4"/></g><text x="114.0" y="371" class="sans t1" font-size="19" font-weight="650" text-anchor="start" letter-spacing="-0.2">Confirm or revert</text><text x="56.0" y="418" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">A 20 s panel after every switch.</text><text x="56.0" y="442" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">No click (black screen, lost stream)</text><text x="56.0" y="466" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">and the Mac goes back on its own.</text><rect x="416.0" y="320" width="368.0" height="172" rx="14" fill="#121a26" stroke="#243246"/><rect x="438.0" y="342" width="44" height="44" rx="12" fill="#5b8cff" fill-opacity="0.196"/><g transform="translate(448.0 352) scale(1.0)" fill="none" stroke="#5b8cff" color="#5b8cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.3" fill="currentColor"/></g><text x="498.0" y="371" class="sans t1" font-size="19" font-weight="650" text-anchor="start" letter-spacing="-0.2">Ends when the Mac locks</text><text x="440.0" y="418" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">Lock the Mac and the mode ends, so</text><text x="440.0" y="442" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">the lock screen shows up on the real</text><text x="440.0" y="466" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">monitors. No dark desk at home.</text><rect x="800.0" y="320" width="368.0" height="172" rx="14" fill="#121a26" stroke="#243246"/><rect x="822.0" y="342" width="44" height="44" rx="12" fill="#5b8cff" fill-opacity="0.196"/><g transform="translate(832.0 352) scale(1.0)" fill="none" stroke="#5b8cff" color="#5b8cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l2.5-6 4 12 2.5-6H22"/></g><text x="882.0" y="371" class="sans t1" font-size="19" font-weight="650" text-anchor="start" letter-spacing="-0.2">Crash and hang recovery</text><text x="824.0" y="418" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">A watchdog, a child process that turns</text><text x="824.0" y="442" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">monitors on before it exits, launchd</text><text x="824.0" y="466" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">KeepAlive and a safe mode.</text><rect x="32.0" y="508" width="368.0" height="172" rx="14" fill="#121a26" stroke="#243246"/><rect x="54.0" y="530" width="44" height="44" rx="12" fill="#5b8cff" fill-opacity="0.196"/><g transform="translate(64.0 540) scale(1.0)" fill="none" stroke="#5b8cff" color="#5b8cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 8.5a1.5 1.5 0 1 0-1.5 1.5H16.5A1.5 1.5 0 1 0 15 8.5v7a1.5 1.5 0 1 0 1.5-1.5h-9A1.5 1.5 0 1 0 9 15.5z"/></g><text x="114.0" y="559" class="sans t1" font-size="19" font-weight="650" text-anchor="start" letter-spacing="-0.2">Emergency hotkey</text><text x="56.0" y="606" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">⌃⌥⌘N always brings the monitors</text><text x="56.0" y="630" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">back. It's a Carbon hotkey, so no</text><text x="56.0" y="654" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">Accessibility permission is needed.</text><rect x="416.0" y="508" width="368.0" height="172" rx="14" fill="#121a26" stroke="#243246"/><rect x="438.0" y="530" width="44" height="44" rx="12" fill="#5b8cff" fill-opacity="0.196"/><g transform="translate(448.0 540) scale(1.0)" fill="none" stroke="#5b8cff" color="#5b8cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><path d="M6.5 9.5l3 2.5-3 2.5M12 15h5"/></g><text x="498.0" y="559" class="sans t1" font-size="19" font-weight="650" text-anchor="start" letter-spacing="-0.2">Works over SSH</text><text x="440.0" y="606" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">The same CLI, local or remote.</text><text x="440.0" y="630" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">status --offline reads the state</text><text x="440.0" y="654" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">files even when the daemon is down.</text><rect x="800.0" y="508" width="368.0" height="172" rx="14" fill="#121a26" stroke="#243246"/><rect x="822.0" y="530" width="44" height="44" rx="12" fill="#5b8cff" fill-opacity="0.196"/><g transform="translate(832.0 540) scale(1.0)" fill="none" stroke="#5b8cff" color="#5b8cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5l1.8 1.8L9 5"/><path d="M12 7h8"/><path d="M4 12.5l1.8 1.8L9 11"/><path d="M12 13h8"/><path d="M4 18.5l1.8 1.8L9 17"/><path d="M12 19h8"/></g><text x="882.0" y="559" class="sans t1" font-size="19" font-weight="650" text-anchor="start" letter-spacing="-0.2">Built-in doctor</text><text x="824.0" y="606" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">Checks display APIs, agents,</text><text x="824.0" y="630" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">heartbeats, RustDesk, SSH/VNC ports,</text><text x="824.0" y="654" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">FileVault, autorestart and updates.</text><rect x="32.0" y="696" width="368.0" height="172" rx="14" fill="#121a26" stroke="#243246"/><rect x="54.0" y="718" width="44" height="44" rx="12" fill="#5b8cff" fill-opacity="0.196"/><g transform="translate(64.0 728) scale(1.0)" fill="none" stroke="#5b8cff" color="#5b8cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3.5" width="19" height="13" rx="2"/><path d="M9.5 8.2a3.2 3.2 0 1 0 5 0M12 6.5v3"/><path d="M8 20.5h8"/></g><text x="114.0" y="747" class="sans t1" font-size="19" font-weight="650" text-anchor="start" letter-spacing="-0.2">Monitor guard</text><text x="56.0" y="794" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">A monitor that wakes mid-session is</text><text x="56.0" y="818" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">switched off again. If it keeps</text><text x="56.0" y="842" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">flapping, it stays on and you're told.</text><rect x="416.0" y="696" width="368.0" height="172" rx="14" fill="#121a26" stroke="#243246"/><rect x="438.0" y="718" width="44" height="44" rx="12" fill="#5b8cff" fill-opacity="0.196"/><g transform="translate(448.0 728) scale(1.0)" fill="none" stroke="#5b8cff" color="#5b8cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10v-6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></g><text x="498.0" y="747" class="sans t1" font-size="19" font-weight="650" text-anchor="start" letter-spacing="-0.2">Update-safe private APIs</text><text x="440.0" y="794" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">CGVirtualDisplay and friends are</text><text x="440.0" y="818" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">looked up at runtime. If an update</text><text x="440.0" y="842" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">drops them, the mode is refused.</text><rect x="800.0" y="696" width="368.0" height="172" rx="14" fill="#121a26" stroke="#243246"/><rect x="822.0" y="718" width="44" height="44" rx="12" fill="#5b8cff" fill-opacity="0.196"/><g transform="translate(832.0 728) scale(1.0)" fill="none" stroke="#5b8cff" color="#5b8cff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7L12 11.5 20.5 7M12 11.5v10"/></g><text x="882.0" y="747" class="sans t1" font-size="19" font-weight="650" text-anchor="start" letter-spacing="-0.2">No dependencies</text><text x="824.0" y="794" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">Swift 6 and Command Line Tools only.</text><text x="824.0" y="818" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">No Xcode, no Homebrew, no packages.</text><text x="824.0" y="842" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">Logs are plain JSON Lines.</text>
</svg>
