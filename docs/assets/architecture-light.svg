<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Architecture</title>
<desc id="desc">Dock buttons and the CLI talk to the daemon over a Unix socket. The daemon spawns a child that holds the virtual display; a separate watchdog reads the daemon's heartbeat. launchd keeps both alive. Display changes go through CoreGraphics and a private API shim.</desc>
<style>
  .sans{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
  .mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
  .t1{fill:#0e1726} .t2{fill:#4a5568} .tm{fill:#768397} .ta{fill:#2f6fed} .tg{fill:#1f9d63}
  .flow{stroke-dasharray:6 9;animation:dash 1.1s linear infinite}
  .pulse{animation:pulse 3.2s ease-in-out infinite}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes dash{to{stroke-dashoffset:-30}}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){.flow,.pulse,.blink{animation:none}}
  
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f7fb"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6fed"/><stop offset="1" stop-color="#6d5cf0"/></linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6fed"/><stop offset=".55" stop-color="#6d5cf0"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#0e1726" fill-opacity="0.05"/></pattern>
  <clipPath id="clip"><rect width="1200" height="760" rx="20"/></clipPath>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.16"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#768397" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#2f6fed" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#1f9d63" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <radialGradient id="glow0" cx="0.6" cy="0.35" r="0.6"><stop offset="0" stop-color="#2f6fed" stop-opacity="0.12"/><stop offset="1" stop-color="#2f6fed" stop-opacity="0"/></radialGradient><radialGradient id="glow1" cx="0.0" cy="0.0" r="0.6"><stop offset="0" stop-color="#6d5cf0" stop-opacity="0.12"/><stop offset="1" stop-color="#6d5cf0" stop-opacity="0"/></radialGradient>
  
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect width="1200" height="760" fill="url(#dots)"/>
  <rect width="1200" height="760" fill="url(#glow0)"/><rect width="1200" height="760" fill="url(#glow1)"/>
</g>
<rect x=".5" y=".5" width="1199" height="759" rx="19.5" fill="none" stroke="#dfe5ee"/>
<text x="40" y="56" class="mono ta" font-size="13" font-weight="600" text-anchor="start" letter-spacing="2.2">ARCHITECTURE</text><text x="40" y="96" class="sans t1" font-size="30" font-weight="700" text-anchor="start" letter-spacing="-0.6">Three processes and one rule: never leave the Mac dark</text><text x="40" y="176" class="mono tm" font-size="12.5" font-weight="600" text-anchor="start" letter-spacing="1.6">ENTRY POINTS</text><rect x="32" y="196" width="252" height="84" rx="14" fill="#ffffff" stroke="#dce3ed"/><text x="52" y="232" class="sans t1" font-size="18" font-weight="650" text-anchor="start">Dock buttons</text><text x="52" y="257" class="sans t2" font-size="14.5" font-weight="400" text-anchor="start">iPad Remote · Layar Normal</text><rect x="32" y="300" width="252" height="84" rx="14" fill="#ffffff" stroke="#dce3ed"/><text x="52" y="336" class="sans t1" font-size="18" font-weight="650" text-anchor="start">ipadmode CLI</text><text x="52" y="361" class="sans t2" font-size="14.5" font-weight="400" text-anchor="start">Terminal, or SSH from the iPad</text><path d="M284 238 C 312 238, 312 290, 330 290" fill="none" stroke="#768397" stroke-width="1.6"/><path d="M284 342 C 312 342, 312 290, 330 290" fill="none" stroke="#768397" stroke-width="1.6"/><line x1="330" y1="290" x2="378" y2="290" stroke="#768397" stroke-width="1.6" marker-end="url(#arrow)"/><text x="40" y="420" class="mono tm" font-size="13.5" font-weight="500" text-anchor="start">unix socket, mode 0600</text><text x="40" y="442" class="mono tm" font-size="13.5" font-weight="500" text-anchor="start">one JSON line per request</text><rect x="356" y="150" width="812" height="350" rx="18" fill="none" stroke="#768397" stroke-opacity=".7" stroke-dasharray="5 6"/><rect x="376" y="136" width="394" height="28" rx="14" fill="#ffffff" stroke="#dce3ed"/><text x="392" y="155" class="mono t2" font-size="13" font-weight="500" text-anchor="start">launchd KeepAlive · safe mode after 3 crashes</text><rect x="382" y="178" width="404" height="296" rx="16" fill="#ffffff" stroke="#2f6fed" stroke-opacity=".55" stroke-width="1.5"/><circle cx="408" cy="210" r="5" fill="#1f9d63" class="pulse"/><text x="422" y="217" class="sans t1" font-size="21" font-weight="700" text-anchor="start">daemon</text><text x="764" y="216" class="mono tm" font-size="13" font-weight="500" text-anchor="end">local.ipadmode.daemon</text><rect x="404.0" y="240" width="174.0" height="62" rx="10" fill="#f6f8fc" stroke="#dce3ed"/><text x="420.0" y="267" class="sans t1" font-size="15.5" font-weight="650" text-anchor="start">Coordinator</text><text x="420.0" y="288" class="sans t2" font-size="14" font-weight="400" text-anchor="start">state machine</text><rect x="590.0" y="240" width="174.0" height="62" rx="10" fill="#f6f8fc" stroke="#dce3ed"/><text x="606.0" y="267" class="sans t1" font-size="15.5" font-weight="650" text-anchor="start">Write-ahead</text><text x="606.0" y="288" class="sans t2" font-size="14" font-weight="400" text-anchor="start">state.json</text><rect x="404.0" y="312" width="174.0" height="62" rx="10" fill="#f6f8fc" stroke="#dce3ed"/><text x="420.0" y="339" class="sans t1" font-size="15.5" font-weight="650" text-anchor="start">Confirm panel</text><text x="420.0" y="360" class="sans t2" font-size="14" font-weight="400" text-anchor="start">and notices</text><rect x="590.0" y="312" width="174.0" height="62" rx="10" fill="#f6f8fc" stroke="#dce3ed"/><text x="606.0" y="339" class="sans t1" font-size="15.5" font-weight="650" text-anchor="start">Heartbeat</text><text x="606.0" y="360" class="sans t2" font-size="14" font-weight="400" text-anchor="start">every 1 s</text><rect x="404.0" y="384" width="174.0" height="62" rx="10" fill="#f6f8fc" stroke="#dce3ed"/><text x="420.0" y="411" class="sans t1" font-size="15.5" font-weight="650" text-anchor="start">Hotkey ⌃⌥⌘N</text><text x="420.0" y="432" class="sans t2" font-size="14" font-weight="400" text-anchor="start">no Accessibility</text><rect x="590.0" y="384" width="174.0" height="62" rx="10" fill="#f6f8fc" stroke="#dce3ed"/><text x="606.0" y="411" class="sans t1" font-size="15.5" font-weight="650" text-anchor="start">Lock watch</text><text x="606.0" y="432" class="sans t2" font-size="14" font-weight="400" text-anchor="start">ends the mode</text><rect x="870" y="178" width="280" height="140" rx="16" fill="#ffffff" stroke="#dce3ed"/><text x="890" y="214" class="sans t1" font-size="19" font-weight="700" text-anchor="start">vdisplay child</text><text x="890" y="244" class="sans t2" font-size="14.5" font-weight="400" text-anchor="start">Holds the virtual display. If the</text><text x="890" y="266" class="sans t2" font-size="14.5" font-weight="400" text-anchor="start">daemon dies, it turns the monitors</text><text x="890" y="288" class="sans t2" font-size="14.5" font-weight="400" text-anchor="start">on first, then lets the display go.</text><line x1="786" y1="228" x2="866" y2="228" stroke="#2f6fed" stroke-width="1.8" marker-end="url(#arrowA)"/><text x="828.0" y="218" class="mono ta" font-size="13" font-weight="600" text-anchor="middle">spawns</text><rect x="870" y="334" width="280" height="140" rx="16" fill="#ffffff" stroke="#dce3ed"/><text x="890" y="370" class="sans t1" font-size="19" font-weight="700" text-anchor="start">watchdog</text><text x="890" y="400" class="sans t2" font-size="14.5" font-weight="400" text-anchor="start">Polls every 0.5 s. Heartbeat stale</text><text x="890" y="422" class="sans t2" font-size="14.5" font-weight="400" text-anchor="start">for 5 s while monitors are off:</text><text x="890" y="444" class="sans t2" font-size="14.5" font-weight="400" text-anchor="start">turn them on, stop the daemon.</text><line x1="866" y1="404" x2="792" y2="404" stroke="#768397" stroke-width="1.6" stroke-dasharray="4 5" marker-end="url(#arrow)"/><text x="828.0" y="394" class="mono tm" font-size="13" font-weight="600" text-anchor="middle">reads</text><text x="828.0" y="426" class="mono tm" font-size="13" font-weight="600" text-anchor="middle">heartbeat</text><line x1="762.0" y1="500" x2="762.0" y2="542" stroke="#768397" stroke-width="1.6" marker-end="url(#arrow)"/><text x="774.0" y="530" class="mono tm" font-size="13" font-weight="500" text-anchor="start">display changes</text><text x="40" y="534" class="mono tm" font-size="12.5" font-weight="600" text-anchor="start" letter-spacing="1.6">MACOS</text><rect x="32" y="548" width="560" height="140" rx="16" fill="#ffffff" stroke="#dce3ed"/><text x="54" y="586" class="sans t1" font-size="19" font-weight="700" text-anchor="start">CoreGraphics</text><text x="193.2" y="585" class="mono tm" font-size="13" font-weight="500" text-anchor="start">public API</text><text x="54" y="618" class="sans t2" font-size="14.5" font-weight="400" text-anchor="start">Display configuration, modes and the</text><text x="54" y="640" class="sans t2" font-size="14.5" font-weight="400" text-anchor="start">display list. Every change is polled</text><text x="54" y="662" class="sans t2" font-size="14.5" font-weight="400" text-anchor="start"> until the system reports it.</text><rect x="608" y="548" width="560" height="140" rx="16" fill="#ffffff" stroke="#dce3ed"/><text x="630" y="586" class="sans t1" font-size="19" font-weight="700" text-anchor="start">CPrivateDisplay</text><text x="801.0" y="585" class="mono tm" font-size="13" font-weight="500" text-anchor="start">Objective-C shim</text><text x="630" y="618" class="sans t2" font-size="14.5" font-weight="400" text-anchor="start">CGVirtualDisplay, SLSConfigureDisplayEnabled,</text><text x="630" y="640" class="sans t2" font-size="14.5" font-weight="400" text-anchor="start">CGSGetDisplayList, CoreDisplay info. Looked</text><text x="630" y="662" class="sans t2" font-size="14.5" font-weight="400" text-anchor="start">up at runtime: no static references.</text><text x="40" y="722" class="mono t2" font-size="13.5" font-weight="500" text-anchor="start">state  ~/Library/Application Support/ipadmode</text><text x="620" y="722" class="mono t2" font-size="13.5" font-weight="500" text-anchor="start">logs  ~/Library/Logs/ipadmode  (JSON Lines)</text>
</svg>
