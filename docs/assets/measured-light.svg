<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="236" viewBox="0 0 1200 236" role="img" aria-labelledby="title desc">
<title id="title">Measured numbers</title>
<desc id="desc">Enter in 3.4 s; monitors back 0.23 s after a daemon kill and 4.8 s after a freeze; 408 tests; 9 of 9 acceptance runs passed.</desc>
<style>
  .sans{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
  .mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
  .t1{fill:#0e1726} .t2{fill:#4a5568} .tm{fill:#768397} .ta{fill:#2f6fed} .tg{fill:#1f9d63}
  .flow{stroke-dasharray:6 9;animation:dash 1.1s linear infinite}
  .pulse{animation:pulse 3.2s ease-in-out infinite}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes dash{to{stroke-dashoffset:-30}}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){.flow,.pulse,.blink{animation:none}}
  
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f7fb"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6fed"/><stop offset="1" stop-color="#6d5cf0"/></linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6fed"/><stop offset=".55" stop-color="#6d5cf0"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#0e1726" fill-opacity="0.05"/></pattern>
  <clipPath id="clip"><rect width="1200" height="236" rx="20"/></clipPath>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.16"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#768397" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#2f6fed" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#1f9d63" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <radialGradient id="glow0" cx="0.5" cy="-0.4" r="0.6"><stop offset="0" stop-color="#2f6fed" stop-opacity="0.12"/><stop offset="1" stop-color="#2f6fed" stop-opacity="0"/></radialGradient>
  
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="236" fill="url(#bg)"/>
  <rect width="1200" height="236" fill="url(#dots)"/>
  <rect width="1200" height="236" fill="url(#glow0)"/>
</g>
<rect x=".5" y=".5" width="1199" height="235" rx="19.5" fill="none" stroke="#dfe5ee"/>
<text x="40" y="46" class="mono tm" font-size="14" font-weight="500" text-anchor="start">Measured on a Mac mini M4 running macOS 27.0.1</text><rect x="32.0" y="66" width="214.4" height="140" rx="14" fill="#ffffff" stroke="#dce3ed"/><rect x="54.0" y="84" width="26" height="3" rx="1.5" fill="url(#brand)"/><text x="54.0" y="136" class="sans" font-size="42" font-weight="700" letter-spacing="-1"><tspan class="t1">3.4</tspan><tspan class="t2" font-size="22" font-weight="600"> s</tspan></text><text x="54.0" y="164" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">From click to an</text><text x="54.0" y="185" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">iPad-only Mac</text><rect x="262.4" y="66" width="214.4" height="140" rx="14" fill="#ffffff" stroke="#dce3ed"/><rect x="284.4" y="84" width="26" height="3" rx="1.5" fill="url(#brand)"/><text x="284.4" y="136" class="sans" font-size="42" font-weight="700" letter-spacing="-1"><tspan class="t1">0.23</tspan><tspan class="t2" font-size="22" font-weight="600"> s</tspan></text><text x="284.4" y="164" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">Monitors back after</text><text x="284.4" y="185" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">the daemon is killed</text><rect x="492.8" y="66" width="214.4" height="140" rx="14" fill="#ffffff" stroke="#dce3ed"/><rect x="514.8" y="84" width="26" height="3" rx="1.5" fill="url(#brand)"/><text x="514.8" y="136" class="sans" font-size="42" font-weight="700" letter-spacing="-1"><tspan class="t1">4.8</tspan><tspan class="t2" font-size="22" font-weight="600"> s</tspan></text><text x="514.8" y="164" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">Monitors back after</text><text x="514.8" y="185" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">the daemon freezes</text><rect x="723.2" y="66" width="214.4" height="140" rx="14" fill="#ffffff" stroke="#dce3ed"/><rect x="745.2" y="84" width="26" height="3" rx="1.5" fill="url(#brand)"/><text x="745.2" y="136" class="sans" font-size="42" font-weight="700" letter-spacing="-1"><tspan class="t1">408</tspan><tspan class="t2" font-size="22" font-weight="600"></tspan></text><text x="745.2" y="164" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">Automated tests,</text><text x="745.2" y="185" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">337 core + 71 system</text><rect x="953.6" y="66" width="214.4" height="140" rx="14" fill="#ffffff" stroke="#dce3ed"/><rect x="975.6" y="84" width="26" height="3" rx="1.5" fill="url(#brand)"/><text x="975.6" y="136" class="sans" font-size="42" font-weight="700" letter-spacing="-1"><tspan class="t1">9/9</tspan><tspan class="t2" font-size="22" font-weight="600"></tspan></text><text x="975.6" y="164" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">Acceptance runs</text><text x="975.6" y="185" class="sans t2" font-size="15.5" font-weight="400" text-anchor="start">on real hardware</text>
</svg>
