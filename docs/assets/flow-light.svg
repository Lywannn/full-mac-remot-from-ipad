<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">How a switch works</title>
<desc id="desc">Enter Remote: preflight, write-ahead state, virtual display, make it main, monitors off. Back to Normal: monitors on, wait until active, restore layout, remove virtual display.</desc>
<style>
  .sans{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif}
  .mono{font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
  .t1{fill:#0e1726} .t2{fill:#4a5568} .tm{fill:#768397} .ta{fill:#2f6fed} .tg{fill:#1f9d63}
  .flow{stroke-dasharray:6 9;animation:dash 1.1s linear infinite}
  .pulse{animation:pulse 3.2s ease-in-out infinite}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes dash{to{stroke-dashoffset:-30}}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){.flow,.pulse,.blink{animation:none}}
  
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f7fb"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6fed"/><stop offset="1" stop-color="#6d5cf0"/></linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6fed"/><stop offset=".55" stop-color="#6d5cf0"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#0e1726" fill-opacity="0.05"/></pattern>
  <clipPath id="clip"><rect width="1200" height="640" rx="20"/></clipPath>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.16"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#768397" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#2f6fed" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#1f9d63" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <radialGradient id="glow0" cx="0.95" cy="0.15" r="0.6"><stop offset="0" stop-color="#2f6fed" stop-opacity="0.12"/><stop offset="1" stop-color="#2f6fed" stop-opacity="0"/></radialGradient><radialGradient id="glow1" cx="0.0" cy="0.95" r="0.6"><stop offset="0" stop-color="#6d5cf0" stop-opacity="0.12"/><stop offset="1" stop-color="#6d5cf0" stop-opacity="0"/></radialGradient>
  
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="640" fill="url(#bg)"/>
  <rect width="1200" height="640" fill="url(#dots)"/>
  <rect width="1200" height="640" fill="url(#glow0)"/><rect width="1200" height="640" fill="url(#glow1)"/>
</g>
<rect x=".5" y=".5" width="1199" height="639" rx="19.5" fill="none" stroke="#dfe5ee"/>
<text x="40" y="56" class="mono ta" font-size="13" font-weight="600" text-anchor="start" letter-spacing="2.2">HOW A SWITCH WORKS</text><text x="40" y="96" class="sans t1" font-size="32" font-weight="700" text-anchor="start" letter-spacing="-0.6">Both directions, step by step</text><rect x="32" y="128" width="1136" height="214" rx="16" fill="#ffffff" stroke="#dce3ed"/><rect x="54" y="148" width="148.8" height="30" rx="15" fill="#2f6fed" fill-opacity="0.135" stroke="#2f6fed" stroke-opacity=".4"/><text x="128.4" y="168" class="sans t1" font-size="15" font-weight="650" text-anchor="middle">Enter Remote</text><text x="216.8" y="168" class="mono tm" font-size="14" font-weight="500" text-anchor="start">≈ 3.4 s</text><line x1="175.6" y1="224" x2="340.79999999999995" y2="224" stroke="#2f6fed" stroke-opacity=".75" stroke-width="2" stroke-linecap="round" class="flow" marker-end="url(#arrowA)"/><line x1="402.79999999999995" y1="224" x2="568.0" y2="224" stroke="#2f6fed" stroke-opacity=".75" stroke-width="2" stroke-linecap="round" class="flow" marker-end="url(#arrowA)"/><line x1="630.0" y1="224" x2="795.1999999999999" y2="224" stroke="#2f6fed" stroke-opacity=".75" stroke-width="2" stroke-linecap="round" class="flow" marker-end="url(#arrowA)"/><line x1="857.1999999999999" y1="224" x2="1022.4000000000001" y2="224" stroke="#2f6fed" stroke-opacity=".75" stroke-width="2" stroke-linecap="round" class="flow" marker-end="url(#arrowA)"/><circle cx="145.6" cy="224" r="25" fill="#2f6fed" fill-opacity="0.144"/><circle cx="145.6" cy="224" r="17" fill="#2f6fed"/><text x="145.6" y="229.5" class="sans " font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">1</text><text x="145.6" y="280" class="sans t1" font-size="17.5" font-weight="650" text-anchor="middle">Preflight</text><text x="145.6" y="305" class="sans t2" font-size="15" font-weight="400" text-anchor="middle">Not locked or mid-switch,</text><text x="145.6" y="325" class="sans t2" font-size="15" font-weight="400" text-anchor="middle">display APIs present</text><circle cx="372.79999999999995" cy="224" r="25" fill="#2f6fed" fill-opacity="0.144"/><circle cx="372.79999999999995" cy="224" r="17" fill="#2f6fed"/><text x="372.79999999999995" y="229.5" class="sans " font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">2</text><text x="372.79999999999995" y="280" class="sans t1" font-size="17.5" font-weight="650" text-anchor="middle">Write-ahead state</text><text x="372.79999999999995" y="305" class="sans t2" font-size="15" font-weight="400" text-anchor="middle">state.json is saved</text><text x="372.79999999999995" y="325" class="sans t2" font-size="15" font-weight="400" text-anchor="middle">before anything changes</text><circle cx="600.0" cy="224" r="25" fill="#2f6fed" fill-opacity="0.144"/><circle cx="600.0" cy="224" r="17" fill="#2f6fed"/><text x="600.0" y="229.5" class="sans " font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">3</text><text x="600.0" y="280" class="sans t1" font-size="17.5" font-weight="650" text-anchor="middle">Virtual display</text><text x="600.0" y="305" class="sans t2" font-size="15" font-weight="400" text-anchor="middle">Created by a child</text><text x="600.0" y="325" class="sans t2" font-size="15" font-weight="400" text-anchor="middle">process at 1180×820 @2x</text><circle cx="827.1999999999999" cy="224" r="25" fill="#2f6fed" fill-opacity="0.144"/><circle cx="827.1999999999999" cy="224" r="17" fill="#2f6fed"/><text x="827.1999999999999" y="229.5" class="sans " font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">4</text><text x="827.1999999999999" y="280" class="sans t1" font-size="17.5" font-weight="650" text-anchor="middle">Make it main</text><text x="827.1999999999999" y="305" class="sans t2" font-size="15" font-weight="400" text-anchor="middle">Moved to (0,0), then a</text><text x="827.1999999999999" y="325" class="sans t2" font-size="15" font-weight="400" text-anchor="middle">1 s pause for RustDesk</text><circle cx="1054.4" cy="224" r="25" fill="#2f6fed" fill-opacity="0.144"/><circle cx="1054.4" cy="224" r="17" fill="#2f6fed"/><text x="1054.4" y="229.5" class="sans " font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">5</text><text x="1054.4" y="280" class="sans t1" font-size="17.5" font-weight="650" text-anchor="middle">Monitors off</text><text x="1054.4" y="305" class="sans t2" font-size="15" font-weight="400" text-anchor="middle">Session scope, then a</text><text x="1054.4" y="325" class="sans t2" font-size="15" font-weight="400" text-anchor="middle">20 s confirm panel</text><rect x="32" y="358" width="1136" height="214" rx="16" fill="#ffffff" stroke="#dce3ed"/><rect x="54" y="378" width="167.6" height="30" rx="15" fill="#1f9d63" fill-opacity="0.15000000000000002" stroke="#1f9d63" stroke-opacity=".4"/><text x="137.8" y="398" class="sans t1" font-size="15" font-weight="650" text-anchor="middle">Back to Normal</text><text x="235.6" y="398" class="mono tm" font-size="14" font-weight="500" text-anchor="start">≈ 5.6 s to the exact layout</text><line x1="204.0" y1="454" x2="426.0" y2="454" stroke="#1f9d63" stroke-opacity=".75" stroke-width="2" stroke-linecap="round" class="flow" marker-end="url(#arrowG)"/><line x1="488.0" y1="454" x2="710.0" y2="454" stroke="#1f9d63" stroke-opacity=".75" stroke-width="2" stroke-linecap="round" class="flow" marker-end="url(#arrowG)"/><line x1="772.0" y1="454" x2="994.0" y2="454" stroke="#1f9d63" stroke-opacity=".75" stroke-width="2" stroke-linecap="round" class="flow" marker-end="url(#arrowG)"/><circle cx="174.0" cy="454" r="25" fill="#1f9d63" fill-opacity="0.16000000000000003"/><circle cx="174.0" cy="454" r="17" fill="#1f9d63"/><text x="174.0" y="459.5" class="sans " font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">1</text><text x="174.0" y="510" class="sans t1" font-size="17.5" font-weight="650" text-anchor="middle">Monitors on</text><text x="174.0" y="535" class="sans t2" font-size="15" font-weight="400" text-anchor="middle">Every monitor in the</text><text x="174.0" y="555" class="sans t2" font-size="15" font-weight="400" text-anchor="middle">saved baseline</text><circle cx="458.0" cy="454" r="25" fill="#1f9d63" fill-opacity="0.16000000000000003"/><circle cx="458.0" cy="454" r="17" fill="#1f9d63"/><text x="458.0" y="459.5" class="sans " font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">2</text><text x="458.0" y="510" class="sans t1" font-size="17.5" font-weight="650" text-anchor="middle">Wait until active</text><text x="458.0" y="535" class="sans t2" font-size="15" font-weight="400" text-anchor="middle">Up to 10 s, since a waking</text><text x="458.0" y="555" class="sans t2" font-size="15" font-weight="400" text-anchor="middle">monitor needs 2–4 s</text><circle cx="742.0" cy="454" r="25" fill="#1f9d63" fill-opacity="0.16000000000000003"/><circle cx="742.0" cy="454" r="17" fill="#1f9d63"/><text x="742.0" y="459.5" class="sans " font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">3</text><text x="742.0" y="510" class="sans t1" font-size="17.5" font-weight="650" text-anchor="middle">Restore layout</text><text x="742.0" y="535" class="sans t2" font-size="15" font-weight="400" text-anchor="middle">Origins, rotation and</text><text x="742.0" y="555" class="sans t2" font-size="15" font-weight="400" text-anchor="middle">the main display</text><circle cx="1026.0" cy="454" r="25" fill="#1f9d63" fill-opacity="0.16000000000000003"/><circle cx="1026.0" cy="454" r="17" fill="#1f9d63"/><text x="1026.0" y="459.5" class="sans " font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">4</text><text x="1026.0" y="510" class="sans t1" font-size="17.5" font-weight="650" text-anchor="middle">Remove virtual display</text><text x="1026.0" y="535" class="sans t2" font-size="15" font-weight="400" text-anchor="middle">Only once a real monitor</text><text x="1026.0" y="555" class="sans t2" font-size="15" font-weight="400" text-anchor="middle">is active again</text><circle cx="52" cy="597" r="11" fill="#1f9d63" fill-opacity=".18"/><path d="M47 597 l3.5 3.5 6-7" fill="none" stroke="#1f9d63" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="74" y="602" class="sans" font-size="16.5"><tspan class="t1" font-weight="650">The rule both paths keep:</tspan><tspan class="t2"> at every moment, at least one display is active.</tspan></text>
</svg>
